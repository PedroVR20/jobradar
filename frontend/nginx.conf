server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Default do nginx é 1MB — baixo demais pro chat do Hunter aceitar print
    # anexado (vira base64 no corpo do POST, ~33% maior que o arquivo
    # original). Sem isso o nginx corta a conexão no meio do upload de uma
    # imagem real e o navegador só vê um 502 genérico, sem chegar nem perto
    # do backend (que já tem seu próprio limite, maior, ver application.yml
    # server.tomcat.max-http-form-post-size — mas essa camada do nginx na
    # frente barra primeiro se não for alinhada).
    client_max_body_size 12m;

    # Rota do SPA React — qualquer path vai pro index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx não tem .mjs no mime.types padrão dele, então serve como
    # application/octet-stream — o navegador recusa carregar como módulo ES
    # ("Strict MIME type checking"). Isso quebrava o worker do pdf.js
    # (pdfjs-dist/build/pdf.worker.min.mjs), usado pra ler currículos em PDF.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    # POST /api/jobs/assistant/chat/stream (SSE, ver JobController) — location
    # mais específica que /api abaixo, o nginx escolhe o prefixo mais longo
    # primeiro. proxy_buffering off é O ponto central: por padrão o nginx
    # junta a resposta inteira do backend num buffer antes de mandar pro
    # navegador — pra uma resposta JSON normal isso não faz diferença
    # nenhuma, mas pra SSE anula o streaming inteiro (todo evento chegaria
    # de uma vez só, no final, exatamente o problema que essa reforma queria
    # resolver). X-Accel-Buffering é o mesmo pedido, só que direto pro
    # SseEmitter do Spring reconhecer.
    location /api/jobs/assistant/chat/stream {
        proxy_pass             http://backend:8080;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     240s;
        chunked_transfer_encoding on;
        add_header              X-Accel-Buffering no;
    }

    # Proxy das chamadas de API para o backend Spring Boot
    location /api {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # POST /api/jobs/fetch roda as 7 fontes de forma síncrona no backend
        # (Nerdin sozinho já levou mais de 1min30 em teste) — com 60s aqui,
        # o nginx cortava a conexão bem antes de terminar e devolvia um 504
        # em HTML, que o frontend tentava interpretar como JSON e quebrava.
        proxy_read_timeout 240s;
    }
}
