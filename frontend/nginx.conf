server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rota do SPA React — qualquer path vai pro index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx não tem .mjs no mime.types padrão dele, então serve como
    # application/octet-stream — o navegador recusa carregar como módulo ES
    # ("Strict MIME type checking"). Isso quebrava o worker do pdf.js
    # (pdfjs-dist/build/pdf.worker.min.mjs), usado pra ler currículos em PDF.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    # Proxy das chamadas de API para o backend Spring Boot
    location /api {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
