name: CI

# Fase 1.4 — não existia CI nenhum antes disso: todo commit dependia de
# rodar `mvn test`/`tsc`/`docker build` manualmente numa sessão. Roda em
# todo push nas branches de trabalho e em toda PR pra main — três jobs
# independentes (backend, frontend, docker), em paralelo, cada um falha
# sozinho sem travar os outros.

on:
  push:
    branches: [main, Dev-local]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        run: mvn -B test

  frontend:
    name: Frontend — tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` já roda `tsc` antes do `vite build` (ver
      # package.json) — um comando só cobre checagem de tipos + bundle.
      - run: npm run build
      # Fase 15.2 — guarda de performance: falha o CI se o bundle PRINCIPAL
      # (o que carrega em toda visita, não os chunks lazy) crescer muito além
      # do medido hoje — pega uma dependência pesada entrando por acidente
      # antes de virar "o app ficou lento" descoberto na prática depois.
      - run: npm run check-bundle-size
      # Fase 10.1 — primeiros testes de frontend (Vitest + Testing Library).
      - run: npm test

  docker-build:
    name: Docker — build das duas imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem do backend
        run: docker build -t job-radar-backend:ci ./backend
      - name: Build imagem do frontend
        run: docker build -t job-radar-frontend:ci ./frontend
