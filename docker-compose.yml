services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar123
    # Fase 12.7 — pg_stat_statements precisa ser pré-carregado no boot do
    # Postgres (shared_preload_libraries); CREATE EXTENSION sozinho não
    # basta, e diferente da maioria das extensões não dá pra ativar depois
    # sem reiniciar o servidor. Com isso, todo diagnóstico de banco daqui
    # pra frente vira "qual query custa mais no total" (dado real, via
    # pg_stat_statements) em vez de EXPLAIN manual em cima de suspeita —
    # foi assim que as 19 queries do /stats (Fase 12.5) só apareceram por
    # eu ter procurado, não porque alguma ferramenta apontou.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Aponta pro serviço "postgres" na rede interna do Compose — usa sempre a porta
      # interna do container (5432), independente do host-side POSTGRES_PORT acima.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobradar
      SPRING_DATASOURCE_USERNAME: jobradar
      SPRING_DATASOURCE_PASSWORD: jobradar123
      # Opcional — recursos de IA (carta de apresentação, duplicatas, classificação)
      # ficam desativados sem isso, o resto do app funciona normal.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Opcional: várias keys separadas por vírgula (projetos diferentes) —
      # se preenchida, o backend faz rodízio automático entre elas quando
      # uma bate no limite do free tier. Tem prioridade sobre GEMINI_API_KEY.
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      # Opcional — troca o modelo padrão. Cuidado: precisa de um default aqui
      # mesmo (não ${GEMINI_MODEL:-} vazio) — o Compose resolve isso ANTES do
      # Spring ver a variável, então uma string vazia "encontrada" pisa no
      # default do application.yml em vez de deixar ele agir.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      # Opcional — só o botão "🔒 Retreinar modelo de salário" nas Configurações
      # funciona com isso preenchido (gate simples, não é segurança de verdade).
      RETRAIN_SECRET_CODE: ${RETRAIN_SECRET_CODE:-}
      # Opcional — integração Gmail (Configurações > "📧 Gmail") fica
      # desativada sem essas duas. Geradas em console.cloud.google.com,
      # credenciais OAuth tipo "Aplicativo da Web" com a Gmail API ativada.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Precisa bater com um dos "URIs de redirecionamento autorizados" do
      # client OAuth no Google Cloud Console.
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/api/gmail/oauth/callback}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # Opcional — estado(s) que ganham uma segunda passada de busca por
      # fonte que suporta filtro geográfico (Gupy, e futuras fontes BR).
      # Separado por vírgula pra mais de um, ex: "Rio de Janeiro,Minas Gerais".
      FOCO_ESTADOS: ${FOCO_ESTADOS:-Rio de Janeiro}
      # Opcional — Adzuna BR (Fase 2.2). Gere grátis em developer.adzuna.com.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      # Fase 8/9 — quem calcula embedding de vaga: "local" (Hunter-Embed
      # próprio, padrão) ou "gemini" (reverte pro GeminiService). O serviço
      # local roda FORA do Docker, direto no WSL2 (GPU sem fricção com o
      # Docker Desktop no Windows) — host.docker.internal alcança o host
      # Windows, que tem o WSL2 fazendo localhost-forwarding da porta do
      # uvicorn. Ver hunter-llm/embed_server.py e HunterEmbeddingProvider.
      HUNTER_EMBEDDING_PROVIDER: ${HUNTER_EMBEDDING_PROVIDER:-local}
      HUNTER_EMBEDDING_URL: ${HUNTER_EMBEDDING_URL:-http://host.docker.internal:8091}
    volumes:
      # Persiste o modelo de salário retreinado fora da imagem — sem isso,
      # um "docker compose up --build" voltaria pro modelo empacotado no jar
      # e o retreino se perderia.
      - ./data:/app/data
      # Fase 5.4 — backup diário do Postgres (ver BackupService), fora do
      # volume nomeado do próprio postgres de propósito: um volume Docker
      # comum e o dump de backup vivendo juntos não protegem contra nada —
      # se o Docker/disco tiver um problema, os dois somem juntos. Pasta no
      # host é resgatável independente do estado dos containers/volumes.
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
