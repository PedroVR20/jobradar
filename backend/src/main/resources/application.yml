spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${SPRING_DATASOURCE_USERNAME:jobradar}
    password: ${SPRING_DATASOURCE_PASSWORD:jobradar123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  tomcat:
    # Default do Tomcat embutido é 2MB — baixo demais pro chat do Hunter
    # aceitar print anexado (imagem vira base64 no corpo do POST, ~33% maior
    # que o arquivo original). Print comprimido no frontend fica bem abaixo
    # disso, mas a margem evita 413/conexão resetada em prints maiores.
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

gemini:
  # Vazio por padrão — recursos de IA ficam desativados sem uma key.
  # Grátis em https://aistudio.google.com/apikey
  api-key: ${GEMINI_API_KEY:}
  # Opcional: várias keys separadas por vírgula (de projetos Google Cloud
  # diferentes, senão compartilham a mesma cota) — se preenchida, tem
  # prioridade sobre api-key e o backend faz rodízio automático entre elas
  # quando uma bate no limite do free tier. Ver GeminiService.
  api-keys: ${GEMINI_API_KEYS:}
  # "gemini-2.5-flash" fixo dava 404 ("no longer available to new users") em
  # projetos Google Cloud criados recentemente, mesmo aparecendo na lista de
  # modelos — o alias "-latest" evita ficar preso a uma versão específica que
  # pode ser descontinuada; testado e funcionando tanto em projetos antigos
  # quanto novos (resolveu pra gemini-3.6-flash nos dois em ago/2026).
  model: ${GEMINI_MODEL:gemini-flash-latest}

google:
  oauth:
    # Vazio por padrão — a integração com Gmail fica desativada (Configurações
    # mostra "não configurado") sem essas duas. Geradas em
    # console.cloud.google.com (Credenciais > Criar credenciais > ID do
    # cliente OAuth, tipo "Aplicativo da Web"). Não são as mesmas keys do
    # Gemini — projeto separado ou o mesmo, tanto faz, só precisa a Gmail API
    # ativada nele.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    # Precisa bater EXATAMENTE (incluindo protocolo/porta) com um dos "URIs de
    # redirecionamento autorizados" cadastrados no client OAuth no Google
    # Cloud Console, senão a Google recusa o callback com redirect_uri_mismatch.
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/gmail/oauth/callback}
    # Pra onde o navegador volta depois do callback processar o código —
    # a origem do frontend, não do backend.
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    br.com.jobradar: INFO

# Gate simples (não é segurança de verdade — app pessoal local) pro botão
# "Retreinar modelo de salário" no frontend. Vazio == recurso desativado.
retrain:
  secret-code: ${RETRAIN_SECRET_CODE:}

salary:
  model:
    # Onde o resultado de um retreino é salvo — fora do jar, num volume
    # montado (ver docker-compose.yml), pra sobreviver a "docker compose up"
    # sem precisar reconstruir a imagem. Ver SalaryPredictionService.
    external-path: ${SALARY_MODEL_PATH:data/salary_model.json}
